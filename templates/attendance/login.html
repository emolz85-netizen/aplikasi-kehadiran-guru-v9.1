{% extends "attendance/base.html" %}
{% block content %}
<section class="card login">
  <h1>Log Masuk</h1>
  <p>{{ SCHOOL_NAME }}</p>
  {% if form.errors %}<div class="error">Nama pengguna atau kata laluan salah.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Nama pengguna</label>{{ form.username }}
    <label>Kata laluan</label>{{ form.password }}
    <button class="primary">Log masuk</button>
    <a class="forgot-password" href="{% url 'password_recovery_request' %}">Lupa kata laluan?</a>
  </form>
</section>
{% endblock %}
